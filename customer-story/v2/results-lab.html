<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Board &mdash; customer story template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@200;300;400;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
        background:#101a35; color:#fff;
        font-family:"Mulish",-apple-system,'Segoe UI',Arial,sans-serif; }
  .gate { width:min(420px,90vw); border:1px solid rgba(255,255,255,.14);
        border-radius:16px; padding:2.6rem; text-align:center;
        background:rgba(255,255,255,.03); }
  .dot { width:12px; height:12px; border-radius:50%; margin:0 auto 1.25rem;
        background:linear-gradient(100deg,#253e7d,#8739e4 55%,#32bef0); }
  h1 { font-size:1.25rem; font-weight:700; margin:0 0 .4rem; letter-spacing:-.01em; }
  p { color:rgba(255,255,255,.6); font-size:.92rem; margin:0 0 1.6rem; line-height:1.5; }
  input { width:100%; box-sizing:border-box; padding:.75rem 1rem; font-size:1rem;
         font-family:inherit; color:#fff; border:1px solid rgba(255,255,255,.2);
         border-radius:8px; background:rgba(255,255,255,.06); }
  input:focus { outline:2px solid #32bef0; }
  button { width:100%; margin-top:1rem; padding:.8rem 1rem; font-size:1rem;
          font-weight:700; font-family:inherit; border:0; border-radius:800px;
          background:#fff; color:#142245; cursor:pointer; }
  button:hover { background:#e9ebf8; }
  .err { color:#ff9d9d; font-size:.85rem; min-height:1.2em; margin:.6rem 0 0; }
</style>
</head>
<body>
<form class="gate" id="gate">
  <div class="dot"></div>
  <h1>Customer story template</h1>
  <p>Web Marketing internal preview. Enter the access password to view.</p>
  <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
  <button type="submit">Unlock</button>
  <p class="err" id="err"></p>
</form>

const STORE = "board-csproto-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPassword(pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
    mat, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function tryDecrypt(key) {
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(NONCE)}, key, b64(DATA));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      await tryDecrypt(key); return;
    } catch (e) { try { localStorage.removeItem(STORE); } catch (e2) {} }
  }
  document.getElementById("gate").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try {
      const key = await keyFromPassword(document.getElementById("pw").value);
      const raw = await crypto.subtle.exportKey("raw", key);
      await tryDecrypt(key);
      try { localStorage.setItem(STORE, btoa(String.fromCharCode(...new Uint8Array(raw)))); } catch (e) {}
    } catch (e) {
      document.getElementById("err").textContent = "Wrong password \u2014 try again.";
    }
  });
}

} else {
