<style>
  html { background:#080d23; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:#eef1fb;

        font-family:"Geist",-apple-system,'Segoe UI',Arial,sans-serif; }
  .gate { position:relative; width:min(400px,calc(100vw - 32px)); box-sizing:border-box;
        border:1px solid rgba(150,180,255,.22); padding:2.4rem 2.2rem 2rem; background:rgba(14,22,49,.72); }
  .gate::before { content:""; position:absolute; left:-1px; right:-1px; top:-1px; height:2px;
        background:linear-gradient(90deg,#2ba7e5,#5b82ff 35%,#a243e9 70%,#f47ad1); }
  .eyebrow { font:500 11px/1 "Geist Mono",monospace; letter-spacing:.14em; text-transform:uppercase;
        color:#aab4d3; margin:0 0 1rem; }
  h1 { font-size:1.6rem; font-weight:500; letter-spacing:-.03em; margin:0 0 .5rem; }
  p { color:#aab4d3; font-size:.92rem; margin:0 0 1.6rem; line-height:1.5; }
  input { width:100%; box-sizing:border-box; padding:.8rem 1rem; font-size:1rem; font-family:inherit;
         color:#eef1fb; border:1px solid rgba(150,180,255,.25); border-radius:0; background:rgba(8,13,35,.6); }
  input:focus { outline:2px solid #2ba7e5; outline-offset:1px; }
  button { width:100%; margin-top:.8rem; padding:.85rem 1rem; font-size:1rem; font-weight:500;
          font-family:inherit; border:0; border-radius:0; background:#eef1fb; color:#080d23; cursor:pointer; }
  button:hover { background:#fff; }
  .err { color:#ff9dcf; font-size:.85rem; min-height:1.2em; margin:.7rem 0 0; }
</style>

const STORE = "board-ts26-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPassword(pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},

}
async function tryDecrypt(key) {
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(NONCE)}, key, b64(DATA));

}
async function boot() {
  let saved = null;

    try {

      await tryDecrypt(key); return;

      await tryDecrypt(key);
      try { localStorage.setItem(STORE, btoa(String.fromCharCode(...new Uint8Array(raw)))); } catch (e) {}

      document.getElementById("err").textContent = "Wrong password, try again.";
